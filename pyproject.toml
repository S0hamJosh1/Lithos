[project]
name = "evcide"
version = "0.1.0"
description = "Embedded Vibe-Coding IDE backend — autonomous firmware loop with runtime verification"
authors = [{name = "Soham + Will"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "TBD"}

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyserial>=3.5",
    "websockets>=13",
    "anyio>=4.6",
]

[project.optional-dependencies]
ble = [
    "bleak>=0.22",
]
ros = [
    # roslibpy is intentional — works without a full ROS install
    "roslibpy>=1.7",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
evcide-api = "evcide.api:main"
evcide-demo = "scripts.demo_xiao:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Tests and scripts intentionally mutate sys.path before importing evcide so they
# run without an editable install; the imports-after-statement E402 is by design.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
